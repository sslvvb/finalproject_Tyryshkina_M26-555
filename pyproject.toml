[project]
name = "finalproject-tyryshkina-m26-555"
version = "0.1.0"
description = "Консольное приложение для работы с валютным кошельком"
readme = "README.md"
authors = [
    { name = "sslvvb", email = "sylviashu@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
finalproject-tyryshkina-m26-555 = "finalproject_tyryshkina_m26_555.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
